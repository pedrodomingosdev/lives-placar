<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>Placar Universal - Aldo Luiz Live</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <button id="btn-pip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <rect x="11" y="9" width="9" height="7" rx="1" ry="1" fill="currentColor"></rect>
        </svg>
        <span>Mini Placar (PiP)</span>
    </button>
    <div id="container-alerta-externo"></div>
    <div id="media-showcase" title="Clique para fechar ou pressione ESC"></div>

    <div class="container futebol" id="card-principal" title="Clique para expandir">
        <div id="camada-animacao" class="tela-anim">
            <img id="img-anim" src="" alt="" style="display: none;">
            <span id="texto-anim">EVENTO!</span>
        </div>

        <div class="branding-bar">
            <div class="brand-left">
                <img src="logo_canal.png" class="canal-logo" onerror="this.style.display='none'">
                <div class="info-jogo">
                    <span id="txt-torneio" class="txt-torneio">AGUARDE...</span>
                    <span id="txt-estadio" class="txt-estadio"></span>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
                <button id="btn-escalacao" class="btn-tabela-topo" style="display: none;" title="Ver Escalação">
                    <span>ESCALAÇÃO</span>
                </button>
                <button id="btn-tabela" class="btn-tabela-topo" style="display: none;" title="Ver Classificação">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                    <span>TABELA</span>
                </button>
                <div class="badge-live-stream"><span class="dot-live-stream"></span>LIVE</div>
            </div>
        </div>

        <div id="placar-dinamico">
            <div style="text-align: center; font-size: 1rem; padding: 10px;">Carregando dados...</div>
        </div>

        <div id="painel-escalacoes" class="painel-escalacoes">
            <div class="abas-painel" id="abas-painel" style="display: none;">
                <button id="btn-titulares" class="aba-btn ativa">Titulares</button>
                <button id="btn-reservas" class="aba-btn">Reservas</button>
            </div>
            <div id="container-conteudo"></div>
        </div>

        <div id="painel-tabela" class="painel-tabela">
            <div id="conteudo-tabela"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
